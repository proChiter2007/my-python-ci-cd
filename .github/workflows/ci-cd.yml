name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Ставим сам проект и тестовые зависимости (pytest и т.д.)
          pip install -e ".[test]"
          
      - name: Run tests
       
        run: |
          pytest tests/ -v --ignore-glob="*test_helpers*" --ignore-glob="*test_reqctx*"

  build-and-run:
    name: Build and Run
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build wheel

      - name: Build package (.whl and .tar.gz)
        run: |
          python -m build

      - name: Create venv and install wheel
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install dist/*.whl

      - name: Install Flaskr example
        run: |
          source venv/bin/activate
          # --no-deps критически важен: не перезаписываем Flask из wheel
          pip install --no-deps -e examples/tutorial/

      - name: Initialize database
        run: |
          source venv/bin/activate
          cd examples/tutorial
          flask --app flaskr init-db

      - name: Run app on port 5000
        run: |
          source venv/bin/activate
          cd examples/tutorial
          flask --app flaskr run --host=0.0.0.0 --port=5000 &
          sleep 5
          curl -f http://localhost:5000 || exit 1
